name: cinnabar
channels:
  - conda-forge
dependencies:
  # Base depends
  - python<3.14  # cinnabar not found by sphinx with 3.14
  - pip
  - networkx
  - numpy
  - matplotlib
  - seaborn
  - plotly
  - scikit-learn
  - adjusttext
  - openff-units
  - duecredit
  - citeproc-py <0.10.3  # the default harvard1 style used by duecredit was changed in 0.10.3, this avoids needing an extra dependency on citeproc-py-styles
  - statsmodels

  # format
  - black

  # testing
  - pytest
  - pytest-cov
  - nbval

  # docs
  - sphinx
  - myst-nb
  - pip:
    - git+https://github.com/OpenFreeEnergy/ofe-sphinx-theme@main
